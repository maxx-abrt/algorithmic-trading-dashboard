[phases.setup]
# Pin the nixpkgs archive that ships Node 22.13.1 (>= the vite@7.3.6 requirement).
# The default archive would otherwise pick the latest Node (e.g. 24) and a patch that may not satisfy our dependencies.
nixpkgsArchive = '51ad838b03a05b1de6f9f2a0fffecee64a9788ee'

# Install build tooling for node-gyp / better-sqlite3 native compilation.
# python3 + make + g++ are the same dependencies the engine/Dockerfile installs.
aptPkgs = ["...", "python3", "make", "g++"]
