[phases.setup]
# Pin the nixpkgs archive that ships Node 22.13.1 (>= the vite@7.3.6 requirement).
# The default archive would otherwise pick the latest Node (e.g. 24) and a patch that may not satisfy our dependencies.
nixpkgsArchive = '51ad838b03a05b1de6f9f2a0fffecee64a9788ee'

# No aptPkgs: better-sqlite3@11.10.0 ships prebuilt binaries for Node 22 linux-x64,
# so python3/make/g++ are not needed. Installing them via apt triggered OOM on the
# Coolify host because g++ pulls in a large dependency tree (gcc, libc6-dev, binutils…).
